[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    db: needs the docker postgres (uses a separate smartclass_test database)
    live: calls the real LLM (skipped when LLM_API_KEY is empty)
    moodle: needs the local Moodle up (skipped when MOODLE_TOKEN is empty)
    face: needs insightface + the buffalo_sc model and rapidocr (skipped when missing)
    e2e: end-to-end UI flows (Maestro / Playwright), run by scripts/e2e-*.sh
    llm_recording: replays tests/fixtures/llm/qa.json (skipped until a live run records it)
# A test that hangs (e.g. waiting on a database lock) fails after 10 minutes instead of
# blocking the whole run; live LLM tests stay well under this.
timeout = 600
