# Student live class (plan-shino.md S38, S38c one-page layout; FR-501–FR-516, FR-520): during an
# open class the student joins from Home, sees only the latest quick question and poll (not the
# earlier closed ones), upvotes a classmate's question, asks one anonymously (tagged Mine), sees it
# marked answered live, finds the older question in the "See all" sheet, votes in the poll that
# arrives live, answers the quick question, reacts, presses "I don't understand", sees the class end
# live, then finds the question in "My questions".
# Run: bash scripts/e2e-mobile.sh student interaction
# Needs the local Moodle up (student4 signs in) and student4 already in SmartClass.
# interaction.setup.sh starts course E2E038's class and the actor (lecturer + classmate via the API).
appId: host.exp.exponent
---
- extendedWaitUntil:
    visible: "Welcome back|Continue"
    timeout: 180000
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 60000

- tapOn:
    id: "login-username"
- inputText: "student4"
- tapOn:
    id: "login-password"
- inputText: "Student123!"
- hideKeyboard
- tapOn: "Sign In"

# Home: the running class offers "Join live class"
- extendedWaitUntil:
    visible:
      id: "dash-live-join"
    timeout: 60000
- takeScreenshot: live-home-join
- tapOn:
    id: "dash-live-join"
- extendedWaitUntil:
    visible: "Live class"
    timeout: 30000
- extendedWaitUntil:
    visible: "Ask, vote, answer and react."
    timeout: 30000

# One page, latest only: the open quick question is shown, the earlier closed one is not
- extendedWaitUntil:
    visible: "E2E: One word for recursion\\?"
    timeout: 30000
- assertNotVisible: "E2E: Earlier quick question"
- assertNotVisible:
    id: "live-tab-polls"
- takeScreenshot: live-page-top

# Upvote the classmate's oldest question (once only). Questions is the last card, so the only
# upvote button below that question's text is its own.
- scrollUntilVisible:
    element: "E2E: Is a heap always a complete tree\\?"
    direction: DOWN
    timeout: 30000
- tapOn:
    text: "Upvote, 0 so far"
    below: "E2E: Is a heap always a complete tree\\?"
- extendedWaitUntil:
    visible: "Upvote, 1 so far"
    timeout: 20000

# Ask anonymously
- scrollUntilVisible:
    element:
      id: "live-ask-input"
    direction: UP
- tapOn:
    id: "live-ask-input"
- inputText: "E2E student question about heaps"
- hideKeyboard
- tapOn:
    id: "live-ask-anon"
- tapOn:
    id: "live-ask-send"
- extendedWaitUntil:
    visible: "Question sent anonymously"
    timeout: 20000
- scrollUntilVisible:
    element: "You \\(anonymous\\).*"
    direction: DOWN
    timeout: 20000
- assertVisible: "Mine"
# The lecturer (actor) marks it answered: the badge arrives live, no refresh
- extendedWaitUntil:
    visible: "Answered"
    timeout: 60000
- takeScreenshot: live-questions

# Only the newest 3 of the 4 questions sit on the page; the oldest is in the "See all" sheet
- assertNotVisible: "E2E: Is a heap always a complete tree\\?"
- tapOn:
    id: "live-questions-all"
- extendedWaitUntil:
    visible:
      id: "live-questions-sheet"
    timeout: 10000
- assertVisible: "All questions \\(4\\)"
- assertVisible: "E2E: Is a heap always a complete tree\\?"
- assertVisible: "Upvote, 1 so far"
- takeScreenshot: live-questions-sheet
- tapOn:
    id: "live-questions-sheet-close"
- extendedWaitUntil:
    notVisible:
      id: "live-questions-sheet"
    timeout: 10000

# The poll the lecturer started arrives live and replaces the earlier closed one
- scrollUntilVisible:
    element: "E2E: Which sort is stable\\?"
    direction: UP
    timeout: 60000
- assertNotVisible: "E2E: Earlier poll"
# "Merge sort" is option 0 (by id: results bars show the same text while results are visible)
- tapOn:
    id: "live-poll-option-0"
- tapOn:
    id: "live-poll-vote"
- extendedWaitUntil:
    visible: "Vote sent"
    timeout: 20000
- extendedWaitUntil:
    visible: "Merge sort \\(your vote\\)"
    timeout: 20000
- assertVisible: "1 voted"
- takeScreenshot: live-poll

# Quick question: answer box, then "Your answer"
- scrollUntilVisible:
    element:
      id: "live-quick-input"
    direction: UP
- tapOn:
    id: "live-quick-input"
- inputText: "selfreference"
- hideKeyboard
- tapOn:
    id: "live-quick-send"
- extendedWaitUntil:
    visible: "Answer sent"
    timeout: 20000
- assertVisible:
    id: "live-quick-mine"
    text: "selfreference"
- assertVisible: "Your answer"
- assertNotVisible:
    id: "live-quick-input"

# React (lecturer-only counts; the student sees the confirmation)
- scrollUntilVisible:
    element:
      id: "live-react-thumbs_up"
    direction: DOWN
- tapOn:
    id: "live-react-thumbs_up"
- extendedWaitUntil:
    visible: "Sent: Thumbs up"
    timeout: 20000

# "I don't understand" with a topic; the actor then ends the class
- tapOn:
    id: "live-confused-add-topic"
- tapOn:
    id: "live-confused-topic"
- inputText: "heaps"
- hideKeyboard
- tapOn:
    id: "live-confused"
- extendedWaitUntil:
    visible: "The lecturer can see the class is unsure.*"
    timeout: 20000
- takeScreenshot: live-signals

# The class ends: the banner says so and the page turns read-only by itself
- scrollUntilVisible:
    element:
      id: "live-ended"
    direction: UP
    timeout: 90000
- assertVisible: "Class ended"
- assertNotVisible:
    id: "live-confused"
- assertNotVisible:
    id: "live-ask-input"
- takeScreenshot: live-ended

# Past questions: the anonymous one is listed as answered
- tapOn:
    id: "live-ended-my-questions"
- extendedWaitUntil:
    visible: "E2E student question about heaps"
    timeout: 20000
- assertVisible: "E2E038 · .* · Anonymous"
- assertVisible: "Answered"
- takeScreenshot: live-my-questions
