# bash scripts/e2e-mobile.sh student interaction
appId: host.exp.exponent
---
- extendedWaitUntil:
    visible: "Welcome back|Continue|Profile"
    timeout: 180000
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
- runFlow:
    when:
      visible: "Welcome back"
    commands:
      - tapOn:
          id: "login-username"
      - inputText: "student4"
      - tapOn:
          id: "login-password"
      - inputText: "Student123!"
      - hideKeyboard
      - tapOn: "Sign In"
- extendedWaitUntil:
    visible:
      id: "join-live-class-E2E050S"
    timeout: 60000
- tapOn:
    id: "join-live-class-E2E050S"
- extendedWaitUntil:
    visible:
      id: "interaction-status"
      text: "Live now"
    timeout: 30000
- tapOn:
    id: "interaction-question-input"
- inputText: "Can we review this example?"
- hideKeyboard
- tapOn:
    id: "interaction-anonymous"
- tapOn: "Send question"
- extendedWaitUntil:
    visible: "Anonymous.*You"
    timeout: 10000
- tapOn: "Polls"
- tapOn: "Queues"
- tapOn: "Submit vote"
- extendedWaitUntil:
    visible: "Your vote is saved."
    timeout: 10000
- assertNotVisible: ".*responses"
- tapOn: "Stacks"
- tapOn: "Update vote"
- extendedWaitUntil:
    visible: "Vote saved."
    timeout: 10000
- tapOn: "Quick answers"
- tapOn: "Write a short answer"
- inputText: "Scheduling tasks"
- hideKeyboard
- tapOn: "Send answer"
- extendedWaitUntil:
    visible: "Your answer is saved."
    timeout: 10000
- tapOn: "Feedback"
- tapOn: "Clear"
- extendedWaitUntil:
    visible: "Reaction sent."
    timeout: 10000
- tapOn: "I don't understand"
- extendedWaitUntil:
    visible: "Class ended.*read-only"
    timeout: 15000
- assertNotVisible: "I don't understand"
