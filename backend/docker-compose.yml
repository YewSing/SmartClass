services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: smartclass
      POSTGRES_USER: smartclass
      POSTGRES_PASSWORD: smartclass_dev
      TZ: Asia/Kuala_Lumpur
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartclass"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
