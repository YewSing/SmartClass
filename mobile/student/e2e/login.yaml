# Login: a student signs in with their SPeCTRUM (Moodle) username + password.
# Run: bash scripts/e2e-mobile.sh student login
# Needs the local Moodle up (backend/moodle, student1 / Student123!) and the backend's
# MOODLE_URL pointing at it. The first login creates the SmartClass account (FR-102).
appId: host.exp.exponent
---
- extendedWaitUntil:
    visible: "Welcome back|Continue"
    timeout: 180000
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 60000

# SPeCTRUM username, not email; nothing prefilled; no administrator sign-in on the phone
- assertVisible: "SPeCTRUM username"
- assertVisible: "Your SPeCTRUM username"
- assertNotVisible: "Matric email"
- assertNotVisible: "Administrator sign-in"

# Wrong password → the 401 message
- tapOn:
    id: "login-username"
- inputText: "student1"
- tapOn:
    id: "login-password"
- inputText: "not-the-password"
- hideKeyboard
- tapOn: "Sign In"
- extendedWaitUntil:
    visible: "Wrong SPeCTRUM username or password."
    timeout: 30000
- assertVisible: "Welcome back"

# Right password → home screen
- tapOn:
    id: "login-password"
- eraseText: 30
- inputText: "Student123!"
- hideKeyboard
- tapOn: "Sign In"
- extendedWaitUntil:
    visible: "Ali Hassan"
    timeout: 60000
- assertVisible: "Assistant"
- assertNotVisible: "Welcome back"
